<!doctype html>
<!-- app-screenshots-in-every-language template: headline + phone showing one capture. Placeholders are double-braced names filled by compose.py. -->
<html lang="{{lang}}" dir="{{dir}}"><head><meta charset="utf-8"><title>{{title}}</title>
<link rel="stylesheet" href="base.css">
<style>{{font_faces}}
:root { {{css_vars}} }
{{extra_css}}</style></head>
<body>
  {{decor}}
  <div class="headline">{{headline}}</div>
  <div class="phone"><div class="bezel"><div class="screen">
    <img src="{{screen}}"><div class="island"></div>
  </div></div></div>
<script>
/* Shrink any line wider than its box (long translations), after fonts load. */
document.fonts.ready.then(() => {
  document.querySelectorAll('.fit').forEach(el => {
    const max = +el.dataset.maxw; let fs = parseFloat(getComputedStyle(el).fontSize);
    el.style.display = 'inline-block'; el.style.whiteSpace = 'nowrap';
    while (el.scrollWidth > max && fs > 10) { fs -= 1; el.style.fontSize = fs + 'px'; }
    el.style.display = '';
  });
});
</script>
</body></html>
